name: OT Comercial V1.5 | GitHub Pages Homologacao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ot-comercial-staging-pages
  cancel-in-progress: true

jobs:
  staging-pages:
    runs-on: ubuntu-latest
    # Pages permaneceu em updating_pages ate o limite de 10 min no run anterior.
    # Tentativa de homologacao isolada com run novo e artefato unico.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout OT V1.5 RC1 validada (commit fixo)
        uses: actions/checkout@v4
        with:
          repository: olegariotech-site/ot-comercial
          ref: d559580fd2779e77a8374faed53032f341a747d6
          path: src
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate de regressao do cache, sincronizacao e fotos
        run: node --test src/tests/qa-*.test.mjs

      - name: Validar cofre cifrado e fotos offline em navegador real
        run: |
          node src/tests/qa-vault.mjs
          node src/tests/qa-real-idb.mjs

      - name: Confirmar acesso anonimo negado no QA real
        run: node src/tests/staging/qa-anon-http.mjs

      - name: Construir pre-visualizacao isolada de homologacao
        run: node src/tests/staging/build-preview.mjs

      - name: Reprovar colisao com o CRM de producao
        run: node src/tests/staging/verify-preview-isolation.mjs

      - name: Verificar arquivos estaticos do Pages
        run: |
          test -s src/artifacts/staging-preview/index.html
          test -s src/artifacts/staging-preview/config.js
          test -s src/artifacts/staging-preview/sw.js
          test -s src/artifacts/staging-preview/field-sync.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site de testes
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/artifacts/staging-preview

      - name: Publicar somente o site de homologacao
        id: deployment
        uses: actions/deploy-pages@v4
